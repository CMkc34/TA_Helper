[project]
name = "trading-helfer"
version = "0.1.0"
description = "Lokale Desktop-App für technische Analyse, Kennzahlen und Backtesting von US-Aktien."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
    "yfinance>=0.2.50",
    "requests>=2.32",
    "exchange-calendars>=4.5",
    "PySide6>=6.7",
    "pyqtgraph>=0.13.7",
]

[project.scripts]
trading-helfer = "trading_helfer.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "hypothesis>=6.100",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_helfer"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PT"]
# RUF001-003: deutsche Typografie („…“, –) in Texten ist gewollt.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]
# Beispiel-Strategien sollen so aussehen, wie eine KI sie schreibt (ohne ClassVar).
"tests/fixtures/**" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = "trading_helfer.core.*"
strict = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "pyqtgraph.*", "exchange_calendars.*", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--cov=trading_helfer",
    "--cov-report=term-missing:skip-covered",
]
markers = [
    "slow: langsame Tests (Benchmarks); auswählen mit -m slow, abwählen mit -m 'not slow'",
]
qt_api = "pyside6"

[tool.coverage.run]
branch = true
source = ["trading_helfer"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
]
